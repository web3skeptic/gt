# Include from the interslavic.space server block:
#   include /etc/nginx/snippets/gt-couch.conf;

# Gym tracker PWA (static build from `npm run build`, base path /gt/)
location = /gt { return 301 /gt/; }
location /gt/ {
    alias /var/www/gt/;
    try_files $uri $uri/ /gt/index.html;
    add_header Cache-Control "no-cache";
}

# CouchDB for the gym tracker and datum, same origin as the app so no CORS is needed.
# CouchDB itself listens on 127.0.0.1 only and requires a valid user for everything.
location = /couch { return 301 /couch/; }
location /couch/ {
    proxy_pass http://127.0.0.1:5984/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffering off;
    proxy_read_timeout 3600s;   # long-poll / continuous _changes feeds
    client_max_body_size 64m;   # _bulk_docs on first sync
}
